<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AESNote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        header {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            z-index: 20;
            position: relative;
            margin-bottom: 0;
        }

        #mainContent {
            box-sizing: border-box;
            position: relative;
            margin-top: 0;
        }

        #headerButtons {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Compact mode: hide non-menu buttons and show dropdown; align menu to right */
        #headerButtons.compact {
            justify-content: flex-end;
            gap: 0;
        }

        #headerButtons.compact>button:not(#menuBtn) {
            display: none !important;
        }

        #headerButtons.compact>#menuBtn {
            margin-left: 0.25rem;
            position: relative;
        }

        #headerButtons.compact>button {
            flex: 0 0 auto;
        }

        /* When compact, make the menu button small and icon-focused */
        #menuBtn.compact {
            width: 36px;
            height: 32px;
            padding: .1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 6px;
            box-sizing: border-box;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
        }

        /* More specific rule to override utility classes when compact */
        #headerButtons.compact>#menuBtn.compact {
            background: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: white !important;
            padding: 0 !important;
            min-width: 36px !important;
            width: 36px !important;
            height: 32px !important;
        }

        /* Breadcrumb stacks vertically when header is compact to avoid overlap */
        #breadcrumb.compact-breadcrumb {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        #breadcrumb.compact-breadcrumb .small-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
        }

        #compactMenu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: white;
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            padding: 0.25rem;
            z-index: 30;
            min-width: 160px;
        }

        #compactMenu.show {
            display: block;
        }

        #compactMenu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: .6rem .8rem;
            border: none;
            background: transparent;
            color: #0f172a;
            border-radius: 4px;
        }

        #compactMenu button:hover {
            background: rgba(15, 23, 42, 0.06);
        }

        /* Mobile-specific adjustments */
        @media (max-width: 640px) {

            /* Hide sidebar to give editor full width */
            #sidebar {
                display: none !important;
            }

            /* Stack main content vertically so editor occupies full width */
            #mainContent {
                flex-direction: column;
                width: 100%;
                overflow-x: hidden;
            }

            main {
                width: 100%;
            }

            /* Make header buttons take proportional width and wrap in portrait */
            #headerButtons {
                display: flex !important;
                gap: .5rem;
                flex-wrap: wrap;
            }

            #headerButtons button {
                flex: 1 1 auto;
                min-width: 0;
                padding: .5rem .6rem;
                font-size: .95rem;
            }

            /* Ensure editor fills available width and doesn't cause horizontal overflow */
            #editor {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                overflow-x: auto;
                overflow-y: auto;
                padding-left: .5rem;
                padding-right: .5rem;
                word-break: break-word;
                overflow-wrap: anywhere;
                white-space: pre-wrap;
                font-size: 1.35rem;
                line-height: 1.2;
            }

            /* Slight adjustments to breadcrumb on narrow screens */
            #breadcrumb {
                font-size: .9rem;
                padding: 0 .5rem;
            }
        }

        /* Extra small screens: reduce breadcrumb padding so it doesn't force horizontal scrolling */
        @media (max-width: 420px) {
            #breadcrumb.compact-breadcrumb {
                padding-right: 56px !important;
            }

            #menuBtn.compact {
                min-width: 32px !important;
                width: 32px !important;
            }
        }

        /* Make editor use border-box and never exceed container width (global safeguard) */
        #editor {
            box-sizing: border-box;
            max-width: 100%;
            width: 100%;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-white">
    <!-- Top Banner -->
    <header class="bg-blue-600 text-white p-2 fixed top-0 left-0 right-0 z-10">
        <div class="flex justify-between items-center">
            <div class="text-xl font-bold">AESNote</div>
            <div id="breadcrumb" class="flex-1 text-center">No directory selected</div>
            <div id="headerButtons" class="space-x-2">
                <button id="newBtn" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">New</button>
                <button id="openBtn" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">Open</button>
                <button id="saveBtn" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">Save</button>
                <button id="saveAsBtn" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">Save As</button>
                <button id="deleteBtn" class="bg-red-500 hover:bg-red-700 px-4 py-2 rounded"
                    style="display: none;">Delete</button>
                <button id="menuBtn" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">Menu</button>

                <!-- Compact dropdown menu (used when header is too narrow) -->
                <div id="compactMenu" aria-hidden="true">
                    <button id="compactNew">New</button>
                    <button id="compactOpen">Open</button>
                    <button id="compactSave">Save</button>
                    <button id="compactSaveAs">Save As</button>
                    <button id="compactSelectDir">Select Directory</button>
                    <button id="compactServerSettings">Server Settings</button>
                    <button id="compactToggleTheme">Toggle Theme</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div id="mainContent" class="flex h-screen dark:bg-gray-800">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-gray-200 p-4 overflow-y-auto dark:bg-black dark:text-white">
            <h3 class="text-lg font-semibold mb-4">Files</h3>
            <ul id="fileList" class="space-y-2"></ul>
        </aside>

        <!-- Editor -->
        <main class="flex-1 p-1">
            <div class="mb-2 space-x-2 dark:bg-black">
                <button onclick="document.execCommand('bold')"
                    class="bg-gray-200 px-3 py-1 rounded dark:bg-black dark:text-white">B</button>
                <button onclick="document.execCommand('italic')"
                    class="bg-gray-200 px-3 py-1 rounded dark:bg-black dark:text-white">I</button>
                <button onclick="document.execCommand('underline')"
                    class="bg-gray-200 px-3 py-1 rounded dark:bg-black dark:text-white">U</button>
                <button onclick="insertUnorderedList()"
                    class="bg-gray-200 px-3 py-1 rounded dark:bg-black dark:text-white">•</button>
                <button onclick="insertOrderedList()"
                    class="bg-gray-200 px-3 py-1 rounded dark:bg-black dark:text-white">1.</button>
            </div>
            <div id="editor" contenteditable="true"
                class="w-full h-full border border-gray-300 p-3 bg-white dark:bg-gray-800 dark:text-white rounded shadow text-lg">
            </div>
        </main>
    </div>

    <!-- Status Bar -->
    <footer class="bg-gray-300 p-1 fixed bottom-0 left-0 right-0 text-sm dark:bg-gray-800 dark:text-white">
        <div class="flex justify-between">
            <div id="wordCount">Words: 0 | Chars: 0</div>
            <div id="saveStatus"></div>
            <div id="securityStatus">Encryption: AES-256-GCM</div>
        </div>
    </footer>

    <!-- Server Settings Modal -->
    <div id="serverModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white dark:bg-gray-800 p-6 rounded shadow-lg w-96 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-semibold mb-4 dark:text-white" id="serverModalTitle">Server Settings</h3>

            <!-- Mode Toggle -->
            <div class="flex mb-4 bg-gray-100 dark:bg-gray-700 rounded p-1">
                <button id="modeLoginBtn"
                    class="flex-1 py-1 rounded bg-white dark:bg-gray-600 shadow-sm text-sm font-medium">Login</button>
                <button id="modeRegisterBtn"
                    class="flex-1 py-1 rounded text-sm font-medium text-gray-500 dark:text-gray-400">Register</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Server API URL</label>
                    <input type="text" id="serverUrlInput"
                        class="border border-gray-300 p-2 w-full dark:bg-gray-700 dark:text-white rounded"
                        placeholder="https://your-server.com/api.php">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
                    <input type="text" id="apiUsernameInput"
                        class="border border-gray-300 p-2 w-full dark:bg-gray-700 dark:text-white rounded"
                        placeholder="Your Username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" id="apiKeyLabel">API
                        Key</label>
                    <input type="password" id="apiKeyInput"
                        class="border border-gray-300 p-2 w-full dark:bg-gray-700 dark:text-white rounded"
                        placeholder="Your Secret Key">
                </div>

                <!-- Change Key Section (Hidden by default) -->
                <div id="changeKeySection" class="hidden pt-4 border-t border-gray-200 dark:border-gray-600">
                    <h4 class="text-sm font-bold mb-2 dark:text-white">Change API Key</h4>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">New API Key</label>
                    <input type="password" id="newApiKeyInput"
                        class="border border-gray-300 p-2 w-full dark:bg-gray-700 dark:text-white rounded"
                        placeholder="New Secret Key">
                    <button id="applyChangeKeyBtn"
                        class="mt-2 w-full bg-yellow-600 hover:bg-yellow-700 text-white py-2 rounded text-sm">Update
                        Key</button>
                </div>
            </div>

            <div class="flex justify-end space-x-2 mt-6">
                <button id="closeServerBtn"
                    class="bg-gray-500 hover:bg-gray-700 px-4 py-2 rounded text-white">Cancel</button>
                <button id="saveServerBtn"
                    class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded text-white">Connect</button>
            </div>
        </div>
    </div>

    <!-- File List Modal (Mobile) -->
    <div id="fileListModal"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 px-4">
        <div class="bg-white dark:bg-gray-800 p-6 rounded shadow-lg w-full max-w-sm max-h-[80vh] flex flex-col">
            <h3 class="text-lg font-semibold mb-4 dark:text-white border-b pb-2">Select File</h3>
            <div id="modalFileList" class="flex-1 overflow-y-auto space-y-1 mb-4 min-h-[100px]">
                <!-- Populated dynamically -->
            </div>
            <div class="flex justify-end pt-2 border-t mt-auto">
                <button id="closeFileListBtn"
                    class="bg-gray-500 hover:bg-gray-700 px-4 py-2 rounded text-white w-full">Close</button>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded shadow-lg">
            <h3 class="text-lg font-semibold mb-4">Enter Password <span id="passwordFileName"
                    class="text-sm text-gray-500"></span></h3>
            <input type="password" id="passwordInput" class="border border-gray-300 p-2 w-full mb-4"
                placeholder="Password">
            <div class="flex justify-end space-x-2">
                <button id="cancelBtn"
                    class="bg-gray-500 hover:bg-gray-700 px-4 py-2 rounded text-white">Cancel</button>
                <button id="unlockBtn"
                    class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded text-white">Unlock</button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let directoryHandle = null;
        let currentFileHandle = null; // Used for local mode
        let currentFileName = null;   // Used for server mode
        let currentPassword = null;
        let isEncrypted = false;
        let db = null;
        let newFileName = null;

        // Server variables
        let serverUrl = localStorage.getItem('serverUrl') || 'https://bookmark.page.gd/AESNote/server/api.php';
        let apiUsername = localStorage.getItem('apiUsername') || '';
        let apiKey = localStorage.getItem('apiKey') || '';

        // Initialize IndexedDB
        function initDB() {
            const request = indexedDB.open('AESNoteDB', 1);
            request.onupgradeneeded = (event) => {
                db = event.target.result;
                if (!db.objectStoreNames.contains('directoryHandle')) {
                    db.createObjectStore('directoryHandle');
                }
            };
            request.onsuccess = (event) => {
                db = event.target.result;
                loadDirectoryHandle();
            };
        }

        // Load directory handle from IndexedDB
        async function loadDirectoryHandle() {
            if (!db) return;
            const transaction = db.transaction(['directoryHandle'], 'readonly');
            const store = transaction.objectStore('directoryHandle');
            const request = store.get('handle');
            request.onsuccess = async () => {
                if (request.result) {
                    directoryHandle = request.result;
                    // Validate handle and permissions; request read/write permission if needed; if still invalid/denied, clear it so user re-selects
                    if (!isValidDirectoryHandle(directoryHandle) || !(await ensureDirectoryPermission(directoryHandle, 'readwrite'))) {
                        console.warn('Stored directory handle is invalid or lacks read/write permission; attempting to request permission.');
                        // Try explicit request if API supports it
                        try {
                            if (isValidDirectoryHandle(directoryHandle) && typeof directoryHandle.requestPermission === 'function') {
                                const reqPerm = await directoryHandle.requestPermission({ mode: 'readwrite' });
                                if (reqPerm === 'granted') {
                                    updateBreadcrumb();
                                    listFiles();
                                    return;
                                }
                            }
                        } catch (e) {
                            console.warn('Explicit permission request failed:', e);
                        }
                        console.warn('Stored directory handle lacks permission; please re-select directory.');
                        directoryHandle = null;
                        updateBreadcrumb();
                        return;
                    }
                    updateBreadcrumb();
                    listFiles();
                } else {
                    // Do not call selectDirectory() here as it requires user gesture
                    updateBreadcrumb();
                }
            };
            request.onerror = () => {
                console.warn('Error reading directory handle from IndexedDB');
            };
        }

        // Save directory handle to IndexedDB (only if read/write permission is available)
        function saveDirectoryHandle() {
            if (!db || !directoryHandle) return;
            ensureDirectoryPermission(directoryHandle, 'readwrite').then(hasPerm => {
                if (!hasPerm) {
                    console.warn('Not saving directory handle because read/write permission not granted.');
                    return;
                }
                const transaction = db.transaction(['directoryHandle'], 'readwrite');
                const store = transaction.objectStore('directoryHandle');
                const req = store.put(directoryHandle, 'handle');
                req.onsuccess = () => console.log('Directory handle saved to IndexedDB');
                req.onerror = (e) => console.warn('Failed to save directory handle:', e);
            }).catch(e => console.warn('Failed to verify permission before saving handle', e));
        }

        // Attempt to request read/write permission for an existing persisted directory handle
        async function requestDirectoryAccess() {
            if (!directoryHandle) {
                // No persisted handle; fall back to asking the user to select one
                // Do not call selectDirectory() here as it requires user gesture
                return;
            }
            try {
                // First, check if we already have permission
                let hasPerm = await ensureDirectoryPermission(directoryHandle, 'readwrite');
                if (!hasPerm && typeof directoryHandle.requestPermission === 'function') {
                    const resp = await directoryHandle.requestPermission({ mode: 'readwrite' });
                    hasPerm = resp === 'granted';
                }
                if (hasPerm) {
                    saveDirectoryHandle();
                    updateBreadcrumb();
                    listFiles();
                    document.getElementById('saveStatus').textContent = 'Access granted for directory';
                    setTimeout(() => document.getElementById('saveStatus').textContent = '', 3000);
                    return true;
                } else {
                    alert('Directory access (read/write) was not granted. Some operations will remain disabled.');
                    updateBreadcrumb();
                    return false;
                }
            } catch (e) {
                console.warn('requestDirectoryAccess failed:', e);
                alert('Failed to request directory access: ' + (e.message || e.name || e));
                return false;
            }
        }

        // Helper to validate directory handle
        function isValidDirectoryHandle(handle) {
            return handle && typeof handle.getFileHandle === 'function';
        }

        // Helper to validate file handle
        function isValidFileHandle(handle) {
            return handle && typeof handle.getFile === 'function' && typeof handle.createWritable === 'function';
        }

        // Ensure we have permission to access/write the directory
        async function ensureDirectoryPermission(dirHandle, mode = 'readwrite') {
            if (!dirHandle || !isValidDirectoryHandle(dirHandle)) return false;
            // Some browsers may not expose queryPermission/requestPermission on handles
            const options = { mode };
            try {
                if (typeof dirHandle.queryPermission === 'function') {
                    const perm = await dirHandle.queryPermission(options);
                    if (perm === 'granted') return true;
                }
                if (typeof dirHandle.requestPermission === 'function') {
                    const req = await dirHandle.requestPermission(options);
                    return req === 'granted';
                }
                // If the methods don't exist, we can't verify; assume it's usable
                return true;
            } catch (e) {
                console.warn('Permission check failed:', e);
                return false;
            }
        }

        // Ensure we have permission to access/read a file handle
        async function ensureFilePermission(fileHandle, mode = 'read') {
            if (!fileHandle || !isValidFileHandle(fileHandle)) return false;
            const options = { mode };
            try {
                if (typeof fileHandle.queryPermission === 'function') {
                    const perm = await fileHandle.queryPermission(options);
                    if (perm === 'granted') return true;
                }
                if (typeof fileHandle.requestPermission === 'function') {
                    const req = await fileHandle.requestPermission(options);
                    return req === 'granted';
                }
                return true;
            } catch (e) {
                console.warn('File permission check failed:', e);
                return false;
            }
        }

        // Crypto functions
        async function deriveKey(password, salt) {
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveBits', 'deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 600000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encrypt(data, password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const key = await deriveKey(password, salt);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                data
            );
            return new Uint8Array([...salt, ...iv, ...new Uint8Array(encrypted)]);
        }

        async function decrypt(encryptedData, password) {
            const salt = encryptedData.slice(0, 16);
            const iv = encryptedData.slice(16, 28);
            const ciphertext = encryptedData.slice(28);
            const key = await deriveKey(password, salt);
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                ciphertext
            );
            return new Uint8Array(decrypted);
        }

        // File operations
        async function selectDirectory() {
            try {
                // Check if the browser supports the File System Access API
                if (!('showDirectoryPicker' in window)) {
                    alert('Your browser does not support directory selection. Please use Chrome or Edge with the latest updates.');
                    return;
                }
                const handle = await window.showDirectoryPicker();
                // Ensure we have read/write permission for the selected directory
                const hasPerm = await ensureDirectoryPermission(handle, 'readwrite');
                if (!hasPerm) {
                    // Try explicit request if available
                    if (typeof handle.requestPermission === 'function') {
                        const req = await handle.requestPermission({ mode: 'readwrite' });
                        if (req !== 'granted') {
                            alert('Directory access (read/write) was not granted. Please grant permission to read and write files.');
                            updateBreadcrumb();
                            return;
                        }
                    } else {
                        // Fallback: warn about potential limited functionality
                        alert('Directory selected but browser did not grant explicit read/write permission. Some operations may fail.');
                    }
                }
                directoryHandle = handle;
                saveDirectoryHandle();
                updateBreadcrumb();
                listFiles();
            } catch (error) {
                console.error('Error selecting directory:', error);
                // Provide a more detailed error message for Microsoft Edge
                if (error.name === 'TypeError') {
                    alert('Directory selection is not supported in this browser. Please use Chrome or Edge with the latest updates.');
                } else if (error.name !== 'NotAllowedError') {
                    alert('Failed to select directory: ' + (error.message || error.name || 'Unknown error'));
                }
            }
        }

        async function selectFile() {
            try {
                // If no directory is selected, prompt the user to choose one first.
                if (!directoryHandle || !isValidDirectoryHandle(directoryHandle)) {
                    await selectDirectory();
                    // If the user canceled directory selection, give a clear status and stop
                    if (!directoryHandle) {
                        document.getElementById('saveStatus').textContent = 'Open canceled: no directory selected';
                        setTimeout(() => document.getElementById('saveStatus').textContent = '', 3000);
                        return;
                    }
                    // Ensure we have read permission for the chosen directory
                    const canRead = await ensureDirectoryPermission(directoryHandle, 'read');
                    if (!canRead) {
                        document.getElementById('saveStatus').textContent = 'Open canceled: read permission denied for selected directory';
                        setTimeout(() => document.getElementById('saveStatus').textContent = '', 4000);
                        return;
                    }
                }

                const options = {
                    types: [
                        { description: 'Encrypted notes', accept: { 'application/octet-stream': ['.ptxt'] } },
                        { description: 'Plain text files', accept: { 'text/plain': ['.txt'] } }
                    ]
                };
                // Now safe to start in the selected directory
                if (directoryHandle && isValidDirectoryHandle(directoryHandle)) {
                    options.startIn = directoryHandle;
                }
                const [fileHandle] = await window.showOpenFilePicker(options);
                console.log('File selected:', fileHandle.name);
                currentFileHandle = fileHandle;
                loadFile(fileHandle);
            } catch (error) {
                console.error('Error selecting file:', error);
                document.getElementById('saveStatus').textContent = 'Failed to open file: ' + (error.message || error.name || 'Unknown error');
                setTimeout(() => document.getElementById('saveStatus').textContent = '', 4000);
            }
        }

        async function listFiles() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            if (serverUrl) {
                try {
                    const response = await fetch(`${serverUrl}?action=list&username=${encodeURIComponent(apiUsername)}&key=${encodeURIComponent(apiKey)}`);
                    if (!response.ok) throw new Error('Failed to fetch from server');
                    const files = await response.json();

                    const modalFileList = document.getElementById('modalFileList');
                    if (modalFileList) modalFileList.innerHTML = '';

                    files.forEach(file => {
                        // Desktop sidebar list
                        const li = document.createElement('li');
                        li.textContent = file.filename;
                        li.className = 'cursor-pointer hover:bg-gray-300 dark:hover:bg-gray-700 p-2 rounded';
                        li.onclick = () => { loadFile(file.filename); if (isMobileDevice()) document.getElementById('fileListModal').classList.add('hidden'); };
                        fileList.appendChild(li);

                        // Mobile modal list
                        if (modalFileList) {
                            const mBtn = document.createElement('button');
                            mBtn.textContent = file.filename;
                            mBtn.className = 'w-full text-left p-3 hover:bg-gray-100 dark:hover:bg-gray-700 rounded border-b dark:border-gray-700 dark:text-gray-200';
                            mBtn.onclick = () => {
                                loadFile(file.filename);
                                document.getElementById('fileListModal').classList.add('hidden');
                            };
                            modalFileList.appendChild(mBtn);
                        }
                    });
                } catch (error) {
                    console.error('Error listing server files:', error);
                    document.getElementById('saveStatus').textContent = 'Server error: ' + error.message;
                }
            } else if (directoryHandle) {
                for await (const [name, handle] of directoryHandle.entries()) {
                    if (name.endsWith('.ptxt') || name.endsWith('.txt')) {
                        const li = document.createElement('li');
                        li.textContent = name;

        async function saveFile({ forceSaveAs = false } = {}) {
            try {
                if (!serverUrl && !directoryHandle) {
                    document.getElementById('saveStatus').textContent = 'No storage configured (Server or Local)';
                    setTimeout(() => document.getElementById('saveStatus').textContent = '', 3000);
                    return;
                }

                let fileName = serverUrl ? currentFileName : (currentFileHandle ? currentFileHandle.name : null);
                let password = currentPassword;

                if (forceSaveAs || (!fileName && !newFileName)) {
                    const nameInput = prompt('Enter file name (e.g., note.ptxt for encrypted, note.txt for plain):', fileName || '');
                    if (!nameInput) return;
                    fileName = nameInput;

                    if (fileName.endsWith('.ptxt')) {
                        isEncrypted = true;
                        password = prompt('Enter password for encryption:');
                        if (!password) return;
                    } else {
                        isEncrypted = false;
                        password = null;
                    }
                } else if (newFileName) {
                    fileName = newFileName;
                    if (!fileName.includes('.')) {
                        fileName += '.txt';
                    }
                    newFileName = null;

                    if (fileName.endsWith('.ptxt')) {
                        isEncrypted = true;
                        if (!password) {
                            password = prompt('Enter password for encryption:');
                            if (!password) return;
                        }
                    } else {
                        isEncrypted = false;
                        password = null;
                    }
                }

                const content = document.getElementById('editor').innerHTML;
                let dataToSave;
                if (isEncrypted) {
                    const data = new TextEncoder().encode(content);
                    dataToSave = await encrypt(data, password);
                } else {
                    dataToSave = content;
                }

                if (serverUrl) {
                    const response = await fetch(`${serverUrl}?action=write&username=${encodeURIComponent(apiUsername)}&filename=${encodeURIComponent(fileName)}&key=${encodeURIComponent(apiKey)}`, {
                        method: 'POST',
                        body: dataToSave
                    });
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || 'Failed to save to server');
                    }
                    currentFileName = fileName;
                } else {
                    // Local save logic: Ensure we have permission
                    if (!(await ensureDirectoryPermission(directoryHandle, 'readwrite'))) {
                        const retry = confirm('Local directory access permission is required to save. Request permission now?');
                        if (retry) {
                            if (!(await requestDirectoryAccess())) {
                                throw new Error('Permission denied');
                            }
                        } else {
                            throw new Error('Permission denied');
                        }
                    }

                    let fileHandle;
                    try {
                        fileHandle = await directoryHandle.getFileHandle(fileName, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(dataToSave);
                        await writable.close();
                        currentFileHandle = fileHandle;
                    } catch (e) {
                        throw new Error('Local save failed: ' + e.message);
                    }
                }

                currentPassword = password;
                document.getElementById('deleteBtn').style.display = 'inline-block';
                updateSecurityStatus();
                listFiles();
                const lbl = document.getElementById('currentFileLabel');
                if (lbl) lbl.textContent = `/${fileName}`;
                document.getElementById('saveStatus').textContent = 'File saved';
                setTimeout(() => document.getElementById('saveStatus').textContent = '', 3000);
            } catch (error) {
                console.error('Save error:', error);
                document.getElementById('saveStatus').textContent = 'Save failed: ' + error.message;
            }
        }

        async function deleteFile() {
            const fileName = serverUrl ? currentFileName : (currentFileHandle ? currentFileHandle.name : null);
            if (!fileName) return;

            try {
                if (serverUrl) {
                    const response = await fetch(`${serverUrl}?action=delete&username=${encodeURIComponent(apiUsername)}&filename=${encodeURIComponent(fileName)}&key=${encodeURIComponent(apiKey)}`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) throw new Error('Failed to delete from server');
                    currentFileName = null;
                } else {
                    // Ensure permission for local delete
                    if (!(await ensureDirectoryPermission(directoryHandle, 'readwrite'))) {
                        if (!(await requestDirectoryAccess())) throw new Error('Permission denied');
                    }
                    await directoryHandle.removeEntry(fileName);
                    currentFileHandle = null;
                }
                document.getElementById('editor').innerHTML = '';
                currentPassword = null;
                isEncrypted = false;
                updateWordCount();
                updateSecurityStatus();
                document.getElementById('deleteBtn').style.display = 'none';
                const lbl = document.getElementById('currentFileLabel');
                if (lbl) lbl.textContent = '';
                listFiles();
                document.getElementById('saveStatus').textContent = 'File deleted';
            } catch (error) {
                console.error('Delete error:', error);
                document.getElementById('saveStatus').textContent = 'Delete failed: ' + error.message;
            }
        }

        async function loadFile(handleOrName) {
            try {
                let fileName;
                let data;

                if (serverUrl) {
                    fileName = handleOrName; // handleOrName is filename string
                    const response = await fetch(`${serverUrl}?action=read&username=${encodeURIComponent(apiUsername)}&filename=${encodeURIComponent(fileName)}&key=${encodeURIComponent(apiKey)}`);
                    if (!response.ok) throw new Error('Failed to read from server');

                    if (fileName.endsWith('.ptxt')) {
                        data = new Uint8Array(await response.arrayBuffer());
                    } else {
                        data = await response.text();
                    }
                    currentFileName = fileName;
                } else {
                    const fileHandle = handleOrName; // handleOrName is FileSystemFileHandle
                    fileName = fileHandle.name;
                    const file = await fileHandle.getFile();
                    if (fileName.endsWith('.ptxt')) {
                        data = new Uint8Array(await file.arrayBuffer());
                    } else {
                        data = await file.text();
                    }
                    currentFileHandle = fileHandle;
                }

                document.getElementById('passwordFileName').textContent = `(${fileName})`;
                const lbl = document.getElementById('currentFileLabel');
                if (lbl) lbl.textContent = `/${fileName}`;
                document.getElementById('deleteBtn').style.display = 'inline-block';

                if (fileName.endsWith('.ptxt')) {
                    isEncrypted = true;
                    // Store the data temporarily for unlockFile to use
                    window._pendingEncryptedData = data;
                    document.getElementById('passwordModal').classList.remove('hidden');
                    document.getElementById('passwordInput').focus();
                } else {
                    isEncrypted = false;
                    document.getElementById('editor').innerHTML = data;
                    currentPassword = null;
                    updateWordCount();
                    updateSecurityStatus();
                    document.getElementById('saveStatus').textContent = 'File loaded';
                }
                localStorage.setItem('lastFile', fileName);
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('saveStatus').textContent = 'Load failed: ' + error.message;
            }
        }

        async function unlockFile() {
            console.log('unlockFile called');
            const password = document.getElementById('passwordInput').value;
            if (!password) return;
            try {
                if (!serverUrl) {
                    if (!currentFileHandle || !isValidFileHandle(currentFileHandle)) {
                        throw new Error('Invalid file handle');
                    }
                    const canRead = await ensureFilePermission(currentFileHandle, 'read');
                    if (!canRead) {
                        throw new Error('Read permission denied for file');
                    }
                }
                const encryptedData = window._pendingEncryptedData;
                const decrypted = await decrypt(encryptedData, password);
                const content = new TextDecoder().decode(decrypted);

                if (!content || content.trim().length === 0) {
                    document.getElementById('editor').innerHTML = '';
                    document.getElementById('passwordModal').classList.add('hidden');
                    document.getElementById('passwordInput').value = '';
                    updateWordCount();
                    document.getElementById('saveStatus').textContent = 'File unlocked (empty)';
                    setTimeout(() => document.getElementById('saveStatus').textContent = '', 4000);
                    return;
                }

                const editor = document.getElementById('editor');
                editor.innerHTML = content;
                editor.focus();
                editor.scrollTop = 0;

                document.getElementById('passwordModal').classList.add('hidden');
                currentPassword = password;
                isEncrypted = true;
                document.getElementById('passwordInput').value = '';
                updateWordCount();
                updateSecurityStatus();
                document.getElementById('saveStatus').textContent = 'File unlocked';
                setTimeout(() => document.getElementById('saveStatus').textContent = '', 3000);
                delete window._pendingEncryptedData;
            } catch (error) {
                console.error('Error unlocking file:', error);
                document.getElementById('saveStatus').textContent = 'Unlock failed: ' + (error.message || error.name || 'Unknown error');
                setTimeout(() => document.getElementById('saveStatus').textContent = '', 5000);
                alert('Incorrect password or corrupted file.');
            }
        }

        function applyResponsiveLayout() {
            const mobile = isMobileDevice();
            const sidebarEl = document.getElementById('sidebar');
            const headerButtons = document.getElementById('headerButtons');
            const editor = document.getElementById('editor');

            if (mobile) {
                if (sidebarEl) sidebarEl.classList.add('hidden');

        // Apply layout on initial load and when screen size/orientation changes
        function adjustLayoutSpacing() {
            try {
                const header = document.querySelector('header');
                const footer = document.querySelector('footer');
                const main = document.getElementById('mainContent');
                const editor = document.getElementById('editor');
                const headerHeight = header ? header.offsetHeight : 0;
                const footerHeight = footer ? footer.offsetHeight : 0;

                // Apply padding to main content so header does not overlap
                if (main) {
                    // Remove any existing padding-top first, then apply new value
                    main.style.paddingTop = '';
                    // Apply exact header height to ensure no gap
                    main.style.paddingTop = headerHeight + 'px';

                    // Also ensure mainContent has proper positioning to work with fixed header
                    main.style.position = 'relative';
                    main.style.top = '0';

                    // Remove any margin that might cause gaps
                    main.style.marginTop = '0';

                    // Ensure no border spacing
                    main.style.borderTop = '0';

                    // Force the padding to be applied by setting it again
                    main.style.paddingTop = headerHeight + 'px';
                }

                // Set editor height to fit between header and footer
                if (editor) {
                    const extra = 12; // small gap
                    const desired = `calc(100vh - ${headerHeight + footerHeight}px - ${extra}px)`;
                    editor.style.height = desired;
                    editor.style.overflow = 'auto';
                    console.log('Applied height to editor:', desired);
                }
            } catch (e) {
                console.warn('adjustLayoutSpacing failed', e);
            }
        }

        // Header overflow detection and compact menu handling
        function hideCompactMenu() {
            const cm = document.getElementById('compactMenu');
            if (cm) {
                cm.classList.remove('show');

                cm.style.position = '';
                cm.style.top = '';
                cm.style.right = '';
            }
        }

        function checkHeaderOverflow() {
            try {
                const hb = document.getElementById('headerButtons');
                if (!hb) return;
                const headerDiv = hb.closest('header')?.querySelector('div.flex');
                const logo = headerDiv ? headerDiv.children[0] : null;
                const breadcrumb = headerDiv ? headerDiv.children[1] : null;
                const menuBtn = document.getElementById('menuBtn');

                // measure total width of non-dropdown children (including margins)
                let total = 0;
                Array.from(hb.children).forEach((el) => {
                    if (el.id === 'compactMenu') return; // skip dropdown
                    const r = el.getBoundingClientRect();
                    if (r && r.width) total += r.width;
                });

                const headerWidth = headerDiv ? headerDiv.getBoundingClientRect().width : window.innerWidth;
                const logoWidth = logo ? logo.getBoundingClientRect().width : 0;
                const breadcrumbWidth = breadcrumb ? breadcrumb.getBoundingClientRect().width : 0;

                // available space for buttons = header width - logo - breadcrumb - small margin
                const availableForButtons = Math.max(0, headerWidth - logoWidth - breadcrumbWidth - 24);

                // Force compact if window or header is small (user request: below 540px)
                const FORCE_THRESHOLD = 540;
                const smallScreen = window.innerWidth < FORCE_THRESHOLD || headerWidth < FORCE_THRESHOLD;

                // If total width exceeds available space, or smallScreen, enter compact mode
                if (smallScreen || total > availableForButtons) {
                    hb.classList.add('compact');
                    // Make sure only the menu is visible and switch menu to compact icon
                    if (menuBtn) {
                        menuBtn.classList.add('compact');
                        menuBtn.setAttribute('aria-label', 'Open menu (actions hidden)');
                        // If forced by threshold, show gear/wheel icon; otherwise hamburger
                        if (smallScreen) {
                            menuBtn.innerHTML = '⚙';
                        } else {
                            menuBtn.innerHTML = '&#9776;';
                        }
                    }

                    // Position only the menu button absolutely to the right corner of the header
                    if (menuBtn) {
                        menuBtn.style.position = 'absolute';
                        menuBtn.style.right = '0.75rem';
                        menuBtn.style.top = '50%';
                        menuBtn.style.transform = 'translateY(-50%)';
                        menuBtn.style.zIndex = '30';
                    }

                    // Reserve space on the breadcrumb to avoid overlap with the compact menu (64px)
                    const breadcrumbEl = document.getElementById('breadcrumb');
                    if (breadcrumbEl) {
                        breadcrumbEl.classList.add('compact-breadcrumb');
                        breadcrumbEl.style.paddingRight = '72px';
                    }
                    const fileLbl = document.getElementById('currentFileLabel'); if (fileLbl) fileLbl.classList.add('small-label');
                } else {
                    hb.classList.remove('compact');
                    hideCompactMenu();
                    if (menuBtn) {
                        menuBtn.classList.remove('compact');
                        menuBtn.setAttribute('aria-label', 'Menu');
                        menuBtn.textContent = 'Menu';
                    }
                    const breadcrumbEl = document.getElementById('breadcrumb');
                    if (breadcrumbEl) {
                        breadcrumbEl.classList.remove('compact-breadcrumb');
                        breadcrumbEl.style.paddingRight = '';
                    }
                    const fileLbl = document.getElementById('currentFileLabel'); if (fileLbl) fileLbl.classList.remove('small-label');

                    // Clear any inline positioning applied to menu button when not compact
                    if (menuBtn) {
                        menuBtn.style.position = '';
                        menuBtn.style.right = '';
                        menuBtn.style.top = '';
                        menuBtn.style.transform = '';
                        menuBtn.style.zIndex = '';
                    }
                }
            } catch (e) {
                console.warn('checkHeaderOverflow error', e);
            }
        }

        // Wire up compact menu toggle

                        cm.style.right = (window.innerWidth - menuRect.right) + 'px';

        document.getElementById('saveServerBtn').onclick = async () => {
            const newUrl = document.getElementById('serverUrlInput').value.trim();
            const newUser = document.getElementById('apiUsernameInput').value.trim();
            const newKey = document.getElementById('apiKeyInput').value.trim();

            if (!newUrl || !newUser || !newKey) {
                alert('All fields are required');
                return;
            }

            if (serverMode === 'register') {
                try {
                    const resp = await fetch(`${newUrl}?action=register&username=${encodeURIComponent(newUser)}&key=${encodeURIComponent(newKey)}`);
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.error || 'Registration failed');
                    alert('Registration successful! You can now log in.');
                    serverMode = 'login';
                    updateServerModeUI();
                    return;
                } catch (e) {
                    alert('Register error: ' + e.message);
                    return;
                }
            }

            // Normal login/save
            // Verify credentials before saving
            try {
                const resp = await fetch(`${newUrl}?action=list&username=${encodeURIComponent(newUser)}&key=${encodeURIComponent(newKey)}`);
                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.error || 'Incorrect username or API key');
                }

                // Only save if verification succeeded
                serverUrl = newUrl;
                apiUsername = newUser;
                apiKey = newKey;

                localStorage.setItem('serverUrl', serverUrl);
                localStorage.setItem('apiUsername', apiUsername);
                localStorage.setItem('apiKey', apiKey);

                document.getElementById('serverModal').classList.add('hidden');
                updateBreadcrumb();
                listFiles();

        document.getElementById('applyChangeKeyBtn').onclick = async () => {
            const newKey = document.getElementById('newApiKeyInput').value.trim();
            if (!newKey) {
                alert('New Key is required');
                return;
            }
            if (!confirm('Are you sure you want to change your API key? This will log you out of other sessions.')) return;

            try {
                const resp = await fetch(`${serverUrl}?action=change_key&username=${encodeURIComponent(apiUsername)}&key=${encodeURIComponent(apiKey)}&new_key=${encodeURIComponent(newKey)}`);
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'Failed to update key');

                alert('API Key updated successfully. Please reconnect with your new key.');
                apiKey = newKey;
                localStorage.setItem('apiKey', apiKey);
                document.getElementById('apiKeyInput').value = apiKey;
                document.getElementById('newApiKeyInput').value = '';
                // Optional: refresh connection
                listFiles();
            } catch (e) {
                alert('Update failed: ' + e.message);
            }
        };

        document.getElementById('openBtn').addEventListener('click', openFileAction);

        document.getElementById('closeFileListBtn').onclick = () => {
            document.getElementById('fileListModal').classList.add('hidden');
        };
        document.getElementById('saveBtn').onclick = () => saveFile();
        document.getElementById('saveAsBtn').onclick = () => saveFile({ forceSaveAs: true });
        document.getElementById('deleteBtn').onclick = () => {
            if (confirm('Are you sure you want to delete this file?')) {
                deleteFile();
            }
        };

        document.getElementById('unlockBtn').addEventListener('click', unlockFile);
        document.getElementById('passwordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                console.log('Enter pressed in password input');
                unlockFile();
            }
        });
        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('passwordInput').value = '';
            const pfn = document.getElementById('passwordFileName'); if (pfn) pfn.textContent = '';
            const lbl = document.getElementById('currentFileLabel'); if (lbl) lbl.textContent = '';
            document.getElementById('deleteBtn').style.display = 'none';
        });
        document.getElementById('editor').addEventListener('input', updateWordCount);

        // Settings
        function loadSettings() {
            const theme = localStorage.getItem('theme') || 'light';
            document.body.classList.toggle('dark', theme === 'dark');
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') || 'light';
            const newTheme = current === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            loadSettings();
        }

        // Update loadFile to store last file
        const originalLoadFile = loadFile;
        loadFile = async (fileHandleOrName) => {
            await originalLoadFile(fileHandleOrName);
            const name = (typeof fileHandleOrName === 'string') ? fileHandleOrName : (fileHandleOrName.name || '');
            if (name) localStorage.setItem('lastFile', name);
        };

        // Menu button: main click handled by the compact-menu toggle; theme toggle is now available inside the compact menu
        document.getElementById('menuBtn').addEventListener('click', () => { /* no-op (menu handled by compact menu) */ });

        // Initialize
        initDB();
        loadSettings();
        updateWordCount();
        updateSecurityStatus();
        updateBreadcrumb(); // Ensure Breadcrumb is correct at start

        // If no directory is selected and no server username is stored, show the server modal
        setTimeout(() => {
            if (!directoryHandle && !apiUsername) {
                openServerModal();
                const s = document.getElementById('saveStatus');
                if (s) {
                    s.textContent = 'Please login or register to use the server storage';
                    setTimeout(() => { if (s.textContent === 'Please login or register to use the server storage') s.textContent = ''; }, 7000);
                }
            }
        }, 800);
    </script>
</body>

</html>
